name: JasonDavey.io CI/CD Pipeline

on:
  push:
    branches:
      - main # Production branch
      - dev # Development branch
  workflow_dispatch: # Also allows manual runs from the GitHub UI

permissions:
  contents: write # Need write permission for auto-merge
  deployments: read
  pull-requests: write # Post Playwright failure summaries to PRs
  issues: write # Same permission used for commit comments

jobs:
  staticChecks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout jasondavey.io
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        run: npm run test:unit:run

      - name: Build
        run: npm run build

  runCypressTestsAgainstVercelPreview:
    needs: staticChecks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Capture Vercel preview URL
        id: vercelPreviewWait
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 180

      - name: Print Vercel preview URL
        run: echo "Vercel URL - ${{ steps.vercelPreviewWait.outputs.url }}"

      - name: Checkout jasondavey.io
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for branch comparison

      - name: Run Cypress tests against Vercel Preview
        uses: cypress-io/github-action@v6
        with:
          record: true
          parallel: false
          config: baseUrl=${{ steps.vercelPreviewWait.outputs.url }}
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

  runPlaywrightTestsAgainstVercelPreview:
    needs: staticChecks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Capture Vercel preview URL
        id: vercelPreviewWait
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 180

      - name: Checkout jasondavey.io
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests against Vercel Preview
        id: playwright
        env:
          PW_BASE_URL: ${{ steps.vercelPreviewWait.outputs.url }}
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Post a failure summary back to the commit (and any open PR) so the
      # author sees what went wrong without digging into the Actions tab.
      - name: Post Playwright failure summary
        if: failure() && steps.playwright.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "playwright-results.json";
            if (!fs.existsSync(path)) {
              core.warning("playwright-results.json not found; skipping comment");
              return;
            }
            const results = JSON.parse(fs.readFileSync(path, "utf8"));

            // Walk Playwright's nested suite structure to collect failures.
            const failures = [];
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests ?? []) {
                  const project = test.projectName || "unknown";
                  const status = test.status || "unknown";
                  if (status === "unexpected" || status === "flaky") {
                    failures.push({
                      title: spec.title,
                      file: spec.file,
                      project,
                      line: spec.line,
                    });
                  }
                }
              }
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const s of results.suites ?? []) walk(s);

            const stats = results.stats ?? {};
            const expected = stats.expected ?? 0;
            const unexpected = stats.unexpected ?? failures.length;
            const flaky = stats.flaky ?? 0;
            const skipped = stats.skipped ?? 0;

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactsUrl = `${runUrl}#artifacts`;

            const lines = [
              `### Playwright failed on \`${context.ref.replace("refs/heads/", "")}\` @ \`${context.sha.slice(0, 7)}\``,
              "",
              `- ❌ **${unexpected}** failed   ✅ ${expected} passed   ${flaky ? `⚠️ ${flaky} flaky   ` : ""}${skipped ? `⏭️ ${skipped} skipped` : ""}`.trim(),
              "",
              "**Failures:**",
              ...failures.slice(0, 20).map((f) => `- \`[${f.project}] ${f.file}:${f.line}\` — ${f.title}`),
              failures.length > 20 ? `- …and ${failures.length - 20} more` : "",
              "",
              `[Run logs](${runUrl}) · [Download HTML report](${artifactsUrl})`,
            ]
              .filter(Boolean)
              .join("\n");

            const { owner, repo } = context.repo;
            const branch = context.ref.replace("refs/heads/", "");

            // Prefer commenting on an open PR; fall back to a commit comment.
            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
            });

            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prs.data[0].number,
                body: lines,
              });
              core.info(`Posted Playwright failure comment to PR #${prs.data[0].number}`);
            } else {
              await github.rest.repos.createCommitComment({
                owner,
                repo,
                commit_sha: context.sha,
                body: lines,
              });
              core.info("Posted Playwright failure comment to commit");
            }

  deployOnGreen:
    needs:
      - runCypressTestsAgainstVercelPreview
      - runPlaywrightTestsAgainstVercelPreview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout jasondavey.io
        if: github.ref == 'refs/heads/dev'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deploy to production when tests pass on main branch
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: curl -X POST "${{ secrets.VERCEL_PROD_DEPLOY_HOOK }}"

      # Direct merge from dev to main when both test jobs pass on dev
      - name: Setup Git Identity
        if: github.ref == 'refs/heads/dev'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Direct merge dev to main
        if: github.ref == 'refs/heads/dev'
        run: |
          git fetch origin
          git checkout main
          git merge --ff-only origin/dev
          git push origin main
